<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bespoke scene — GSAP + Ink & Signal tokens</title>
<!-- Render: node render/cli.mjs render examples/bespoke-gsap.html --out bespoke.mp4 -->
<script src="../runtime/vendor/gsap.min.js"></script>
<script src="../runtime/vendor/CustomEase.min.js"></script>
<style>html,body{margin:0;background:transparent}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { T } from '../runtime/core.js';
import { loadFonts } from '../runtime/player.js';
import { registerEases, scene, dur } from '../runtime/gsap-bridge.js';
await loadFonts('../');
registerEases(gsap, CustomEase);
const c = document.getElementById('c'), x = c.getContext('2d');
// state animated by GSAP; drawn to canvas every frame (deterministic: the timeline is paused and seeked)
const s = { bar: 0, word: 0, y: 80, stamp: 0 };
const tl = gsap.timeline({ paused: true })
  .to(s, { bar: 1, duration: dur('selectionDraw') * 2, ease: 'is.wipe' })
  .to(s, { word: 1, y: 0, duration: dur('titleLand'), ease: 'is.snap' }, '-=0.1')
  .to(s, { stamp: 1, duration: dur('stampSpin'), ease: 'is.stamp' }, '-=0.15')
  .to({}, { duration: 1.5 });
scene({ fps: 30, duration: Math.ceil(tl.duration() * 30), timeline: tl, canvas: c, name: 'bespoke-gsap', draw() {
  x.clearRect(0, 0, 1080, 1920);
  x.fillStyle = T.color.ink; x.fillRect(0, 900, 1080 * s.bar, 160);
  x.save(); x.beginPath(); x.rect(0, 900, 1080, 160); x.clip();
  x.globalAlpha = s.word; x.fillStyle = T.color.signal; x.font = '120px "IS display"'; x.textAlign = 'center';
  x.fillText('CUSTOM', 540, 1030 + s.y); x.restore();
  x.save(); x.translate(900, 860); x.rotate((1 - s.stamp) * -Math.PI / 2); x.scale(s.stamp * 1.6, s.stamp * 1.6); x.translate(-20, -20);
  x.fillStyle = T.color.signal; x.fill(new Path2D(T.glyph.star)); x.restore();
} });
</script>
</body>
</html>
