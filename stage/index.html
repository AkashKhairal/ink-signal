<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink &amp; Signal — stage</title>
<script type="importmap">
{ "imports": { "three": "../runtime/vendor/three.module.min.js", "three/addons/": "../runtime/vendor/addons/" } }
</script>
<style>
  html, body { margin: 0; background: transparent; }
  body.preview { background: #141414; color: #ECEBE6; font: 13px/1.4 system-ui, sans-serif; }
  #wrap { display: inline-block; line-height: 0; }
  body.preview #wrap { display: block; margin: 16px auto 0; width: max-content; box-shadow: 0 0 0 1px #2A2A2A; background: repeating-conic-gradient(#1c1c1c 0 25%, #222 0 50%) 0 0/24px 24px; }
  #bar { display: none; }
  body.preview #bar { display: flex; gap: 12px; align-items: center; max-width: 900px; margin: 12px auto; padding: 0 16px; }
  #bar input[type=range] { flex: 1; accent-color: #F2362B; }
  #bar button { background: #F2362B; color: #0E0E0E; border: 0; padding: 8px 14px; font-weight: 700; cursor: pointer; }
  #err { color: #F2362B; white-space: pre-wrap; padding: 16px; font: 13px monospace; }
  html.embed, body.embed { width: 100%; height: 100%; overflow: hidden; background: #0B0B0C; }
  body.embed[data-bg=checker] { background: repeating-conic-gradient(#151516 0 25%, #1B1B1C 0 50%) 0 0/22px 22px; }
  body.embed #err { position: fixed; top: 0; left: 0; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="bar"><button id="play" type="button">Pause</button><input id="scrub" type="range" min="0" value="0" aria-label="Frame"><span id="fc">0</span></div>
<div id="err"></div>
<script type="module">
import { boot } from '../runtime/player.js';
import { runEmbed, embedError } from './embed.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const root = new URL('../', location.href).href;
try {
  let spec = null, comp = q.get('comp') || 'chapter', params = {};
  if (q.get('params')) params = JSON.parse(q.get('params'));
  if (q.get('format')) params.format = q.get('format');
  if (q.get('spec')) spec = await (await fetch(q.get('spec'))).json();
  if (q.get('plan')) { comp = 'edit'; params = { plan: await (await fetch(q.get('plan'))).json() }; }
  const base = q.get('base') || (q.get('plan') ? q.get('plan').replace(/[^/]*$/, '') : '');
  const IS = await boot({ canvas, root, comp, params, spec, base, guides: q.get('guides') === '1', only: q.get('only') });
  window.IS = IS;
  const scale = parseFloat(q.get('scale') || '1');
  if (scale !== 1) { canvas.style.width = IS.spec.width * scale + 'px'; canvas.style.height = IS.spec.height * scale + 'px'; }
  const frame = q.get('frame');
  await IS.seek(frame ? parseFloat(frame) : 0);
  if (q.get('embed') === '1') {
    runEmbed({ el: document.getElementById('wrap'), width: IS.spec.width, height: IS.spec.height, duration: IS.duration, fps: IS.fps, name: IS.spec.name, seek: (f) => IS.seek(Math.floor(f)) });
  } else if (q.get('play') === '1') {
    document.body.classList.add('preview');
    const scrub = document.getElementById('scrub'), fc = document.getElementById('fc'), btn = document.getElementById('play');
    scrub.max = IS.duration - 1;
    let f = 0, playing = true, last = performance.now(), busy = false;
    btn.onclick = () => { playing = !playing; btn.textContent = playing ? 'Pause' : 'Play'; };
    scrub.oninput = () => { f = +scrub.value; playing = false; btn.textContent = 'Play'; };
    const tick = async (now) => {
      if (!busy) {
        busy = true;
        if (playing) { f = (f + ((now - last) / 1000) * IS.fps) % IS.duration; }
        last = now;
        await IS.seek(Math.floor(f));
        scrub.value = Math.floor(f); fc.textContent = `${Math.floor(f)} / ${IS.duration}  ·  ${IS.spec.name}  ·  ${IS.spec.width}×${IS.spec.height}`;
        busy = false;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  window.__IS_READY = true;
} catch (e) {
  document.getElementById('err').textContent = String(e && e.stack || e);
  window.__IS_ERROR = String(e && e.stack || e);
  embedError(e);
}
</script>
</body>
</html>
