<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*TITLE*/ · review</title>
<style>
@font-face { font-family: 'IS display'; src: url('assets/ArchivoExpanded-Black.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'IS ui'; src: url('assets/Archivo-Variable.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
@font-face { font-family: 'IS mono'; src: url('assets/JetBrainsMono-Medium.ttf') format('truetype'); font-display: swap; }
:root { --bg: #ECEBE6; --panel: #FFFFFF; --ink: #0E0E0E; --muted: #6E6C67; --line: #DEDCD5; --soft: #F2F1EC; --acc: #F2362B; --stage: #D8D6CF; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0B0B0C; --panel: #1A1A1B; --ink: #ECEBE6; --muted: #8E8E8B; --line: #2A2A2A; --soft: #232325; --stage: #000; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0B0B0C; --panel: #1A1A1B; --ink: #ECEBE6; --muted: #8E8E8B; --line: #2A2A2A; --soft: #232325; --stage: #000; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 'IS ui', system-ui, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; justify-content: space-between; }
h1 { margin: 0; font: 400 clamp(22px, 3vw, 34px)/1 'IS display', sans-serif; text-transform: uppercase; letter-spacing: -0.01em; }
h1 i { font-style: normal; color: var(--acc); }
.sub { color: var(--muted); font-size: 14px; }
.tabs { display: flex; gap: 6px; }
.tabs button, .ctl button { font: 600 14px 'IS ui', sans-serif; color: var(--ink); background: var(--soft); border: 1px solid var(--line); padding: 7px 14px; cursor: pointer; }
.tabs button[aria-selected="true"], .ctl button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 880px) { .main { grid-template-columns: 1fr; } }
.player { background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.screen { position: relative; background: var(--stage); }
.screen video { display: block; width: 100%; max-height: 72vh; object-fit: contain; background: var(--stage); }
.info { padding: 16px 18px 18px; display: grid; gap: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.tc { font: 13px 'IS mono', monospace; background: var(--soft); padding: 3px 9px; }
.tag { font: 600 12px 'IS ui'; color: #fff; background: var(--acc); padding: 2px 9px; text-transform: uppercase; letter-spacing: .06em; }
.title { margin: 0; font: 680 20px 'IS ui'; letter-spacing: -.015em; }
.quote { margin: 0; color: var(--muted); max-width: 65ch; }
.file { font: 12.5px 'IS mono', monospace; color: var(--muted); overflow-wrap: anywhere; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.list button { width: 100%; text-align: left; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; cursor: pointer; color: var(--ink); font: inherit; }
.list button[aria-current="true"] { border-color: var(--ink); box-shadow: inset 4px 0 0 var(--acc); }
.num { font: 400 15px 'IS display'; display: flex; align-items: center; justify-content: center; height: 38px; background: var(--soft); }
.list button[aria-current="true"] .num { background: var(--acc); color: #fff; }
.it { font-weight: 640; } .itc { font: 12px 'IS mono'; color: var(--muted); } .iq { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cmp { background: var(--panel); border: 1px solid var(--line); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ctl input[type=range] { flex: 1; min-width: 140px; accent-color: var(--acc); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pair.stack { grid-template-columns: 1fr; }
.pair video, .wipe video { width: 100%; display: block; background: var(--stage); }
.wipe { position: relative; }
.wipe .top { position: absolute; inset: 0; overflow: hidden; }
.wipe .bar { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--acc); }
.lab { font: 12px 'IS mono'; color: var(--muted); margin-bottom: 4px; }
.marks { position: relative; height: 18px; background: var(--soft); }
.marks span { position: absolute; top: 0; bottom: 0; background: var(--acc); opacity: .75; }
.foot { color: var(--muted); font-size: 13px; max-width: 80ch; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>/*TITLE*/ <i>·</i> B-roll</h1>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="clips">Clips</button><button role="tab" aria-selected="false" data-tab="compare">Before / after</button></div>
  </header>
  <div class="sub">/*SUB*/</div>
  <section id="clips" class="main">
    <div class="player">
      <div class="screen"><video id="vid" playsinline muted autoplay loop preload="auto"></video></div>
      <div class="info">
        <div class="meta"><span class="tc" id="tc"></span><span class="tag" id="tag" hidden>Transparent panel</span></div>
        <h2 class="title" id="title"></h2>
        <p class="quote" id="quote"></p>
        <div class="file" id="file"></div>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </section>
  <section id="compare" class="cmp" hidden>
    <div class="ctl"><button class="on" data-mode="side">Side by side</button><button data-mode="stack">Stacked</button><button data-mode="wipe">Wipe</button><button id="play">Play</button><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Time"><span class="tc" id="ctc">0:00.00</span></div>
    <div class="marks" id="marks" title="where the B-roll sits"></div>
    <div class="pair" id="pair"><div><div class="lab">Original</div><video id="a" playsinline muted preload="auto"></video></div><div><div class="lab">With motion graphics</div><video id="b" playsinline muted preload="auto"></video></div></div>
    <div class="wipe" id="wipe" hidden><video id="wa" playsinline muted preload="auto"></video><div class="top" id="wtop"><video id="wb" playsinline muted preload="auto"></video></div><div class="bar" id="wbar"></div></div>
  </section>
  <p class="foot">This preview is for review. For the final cut, place the clips in your editor (see TIMING.md): transparent panels are ProRes 4444 .mov files on a track above the video.</p>
</div>
<script>
const CLIPS = /*CLIPS*/[]; const MARKS = /*MARKS*/[]; const DUR = /*DUR*/0; const ORIG = '/*ORIG*/', PREV = '/*PREV*/';
const $ = (id) => document.getElementById(id);
const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(2).padStart(5, '0')}`;
// tabs
document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { document.querySelectorAll('[data-tab]').forEach((x) => x.setAttribute('aria-selected', x === b)); $('clips').hidden = b.dataset.tab !== 'clips'; $('compare').hidden = b.dataset.tab !== 'compare'; if (b.dataset.tab === 'compare') $('vid').pause(); });
// clips
let cur = 0;
function show(i) {
  cur = i; const c = CLIPS[i]; const v = $('vid'); v.src = c.src; v.play().catch(() => {});
  $('tc').textContent = c.tc; $('title').textContent = c.t; $('quote').textContent = c.q || ''; $('file').textContent = c.f; $('tag').hidden = !c.alpha;
  document.querySelectorAll('#list button').forEach((b, k) => b.setAttribute('aria-current', k === i));
}
CLIPS.forEach((c, i) => { const li = document.createElement('li'); li.className = 'item'; li.innerHTML = `<button type="button"><span class="num">${c.n}</span><span><span class="it"></span><br><span class="itc">${c.tc}</span><span class="iq"></span></span></button>`; li.querySelector('.it').textContent = c.t; li.querySelector('.iq').textContent = c.q || ''; li.querySelector('button').onclick = () => show(i); $('list').appendChild(li); });
if (CLIPS.length) show(0);
addEventListener('keydown', (e) => { if ($('clips').hidden) return; if (e.key === 'ArrowDown' || e.key === 'ArrowRight') show(Math.min(CLIPS.length - 1, cur + 1)); if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') show(Math.max(0, cur - 1)); });
// compare
const vids = [$('a'), $('b'), $('wa'), $('wb')]; vids[0].src = vids[2].src = ORIG; vids[1].src = vids[3].src = PREV;
MARKS.forEach(([a, b]) => { const s = document.createElement('span'); s.style.left = (a / DUR) * 100 + '%'; s.style.width = ((b - a) / DUR) * 100 + '%'; $('marks').appendChild(s); });
let mode = 'side', playing = false, wipeX = 0.5;
document.querySelectorAll('[data-mode]').forEach((b) => b.onclick = () => { mode = b.dataset.mode; document.querySelectorAll('[data-mode]').forEach((x) => x.classList.toggle('on', x === b)); $('pair').hidden = mode === 'wipe'; $('wipe').hidden = mode !== 'wipe'; $('pair').classList.toggle('stack', mode === 'stack'); sync(vids[0].currentTime); });
const active = () => (mode === 'wipe' ? [vids[2], vids[3]] : [vids[0], vids[1]]);
function sync(t) { vids.forEach((v) => { if (Math.abs(v.currentTime - t) > 0.04) v.currentTime = t; }); $('ctc').textContent = fmt(t); $('scrub').value = DUR ? (t / DUR) * 1000 : 0; }
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; active().forEach((v) => (playing ? v.play().catch(() => {}) : v.pause())); };
$('scrub').oninput = () => sync(($('scrub').value / 1000) * DUR);
setInterval(() => { if (!playing) return; const [m, s] = active(); if (Math.abs(s.currentTime - m.currentTime) > 0.06) s.currentTime = m.currentTime; $('ctc').textContent = fmt(m.currentTime); $('scrub').value = DUR ? (m.currentTime / DUR) * 1000 : 0; }, 100);
const wipe = $('wipe'); const setW = (x) => { wipeX = Math.min(1, Math.max(0, x)); $('wtop').style.clipPath = `inset(0 0 0 ${wipeX * 100}%)`; $('wbar').style.left = `calc(${wipeX * 100}% - 1px)`; };
setW(0.5); wipe.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType !== 'mouse') { const r = wipe.getBoundingClientRect(); setW((e.clientX - r.left) / r.width); } }); wipe.addEventListener('pointerdown', (e) => { const r = wipe.getBoundingClientRect(); setW((e.clientX - r.left) / r.width); });
</script>
</body>
</html>
